# ═══════════════════════════════════════════════════════════════
# Veritas Namespaces and Security Policies
# ═══════════════════════════════════════════════════════════════
apiVersion: v1
kind: Namespace
metadata:
  name: veritas
  labels:
    name: veritas
    istio-injection: enabled
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: veritas-sandbox
  labels:
    name: veritas-sandbox
    istio-injection: enabled
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Default deny-all network policy for veritas namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: veritas
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Default deny-all for sandbox namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: veritas-sandbox
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow DNS egress for all pods in veritas namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: veritas
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Resource Quotas for veritas namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: veritas-quota
  namespace: veritas
spec:
  hard:
    requests.cpu: "500"
    requests.memory: "2Ti"
    limits.cpu: "1000"
    limits.memory: "4Ti"
    requests.nvidia.com/gpu: "128"
    pods: "500"
    services: "50"
    persistentvolumeclaims: "50"
---
# Resource Quotas for sandbox (much smaller)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: veritas-sandbox-quota
  namespace: veritas-sandbox
spec:
  hard:
    requests.cpu: "64"
    requests.memory: "256Gi"
    limits.cpu: "128"
    limits.memory: "512Gi"
    requests.nvidia.com/gpu: "8"
    pods: "50"
    services: "10"
---
# Sandbox: Block all traffic to production namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: block-production-access
  namespace: veritas-sandbox
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Only allow DNS and internal sandbox communication
    - to:
        - podSelector: {}
      ports:
        - port: 50051
        - port: 8001
        - port: 9092
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
    # Explicitly NO egress to veritas namespace or internet
