[project]
name = "veritas-l2-biometric"
version = "0.1.0"
description = "Veritas L2 Biometric Scanner - rPPG, micro-flicker, and eye-movement analysis"
requires-python = ">=3.11"
license = "Proprietary"
authors = [{ name = "Veritas Security", email = "engineering@veritas.security" }]

dependencies = [
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "kafka-python-ng>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "opencv-python-headless>=4.9.0",
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
