# ═══════════════════════════════════════════════════════════════
# Veritas B2B - CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ── Rust Services ─────────────────────────────────────────

  rust-check:
    name: Rust Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler librdkafka-dev cmake

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build all services
        run: cargo build --release

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    needs: rust-check
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s
      kafka:
        image: confluentinc/cp-kafka:7.7.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:29093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler librdkafka-dev cmake

      - name: Run tests
        run: cargo test --all --release
        env:
          VERITAS__KAFKA__BROKERS: localhost:9092
          VERITAS__REDIS__URL: redis://localhost:6379

  rust-security:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── Python ML Services ────────────────────────────────────

  python-check:
    name: Python Check & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [l2-biometric, l3-deepnet]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd ml/${{ matrix.service }}
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install ruff mypy

      - name: Lint with ruff
        run: |
          cd ml/${{ matrix.service }}
          ruff check src/

      - name: Type check with mypy
        run: |
          cd ml/${{ matrix.service }}
          mypy src/ --ignore-missing-imports || true

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: python-check
    strategy:
      matrix:
        service: [l2-biometric, l3-deepnet]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd ml/${{ matrix.service }}
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          cd ml/${{ matrix.service }}
          pytest tests/ -v --cov=src || echo "No tests found yet"

  # ── Container Builds ──────────────────────────────────────

  build-containers:
    name: Build Container Images
    runs-on: ubuntu-latest
    needs: [rust-check, python-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: gateway
            dockerfile: infrastructure/docker/Dockerfile.rust
          - service: ingest
            dockerfile: infrastructure/docker/Dockerfile.rust
          - service: l1-scanner
            dockerfile: infrastructure/docker/Dockerfile.rust
          - service: scorer
            dockerfile: infrastructure/docker/Dockerfile.rust
          - service: signer
            dockerfile: infrastructure/docker/Dockerfile.rust
          - service: l2-biometric
            dockerfile: infrastructure/docker/Dockerfile.python
          - service: l3-deepnet
            dockerfile: infrastructure/docker/Dockerfile.python
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/veritas-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/veritas-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Container Security Scan ───────────────────────────────

  trivy-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: build-containers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [gateway, ingest, l1-scanner, scorer, signer]
    steps:
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/veritas-${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
