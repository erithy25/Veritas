[workspace]
resolver = "2"
members = [
    "services/shared",
    "services/gateway",
    "services/ingest",
    "services/l1-scanner",
    "services/scorer",
    "services/signer",
    "services/compliance",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"
authors = ["Veritas Security <engineering@veritas.security>"]

[workspace.dependencies]
# gRPC & Networking
tonic = { version = "0.12", features = ["tls", "gzip"] }
tonic-build = "0.12"
tonic-health = "0.12"
tonic-reflection = "0.12"
prost = "0.13"
prost-types = "0.13"

# Async Runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.24", features = ["trace", "metrics"] }
opentelemetry-otlp = "0.17"

# Kafka
rdkafka = { version = "0.36", features = ["cmake-build", "ssl"] }

# Redis
redis = { version = "0.27", features = ["tokio-comp", "cluster-async", "tls-rustls"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
clickhouse = { version = "0.13", features = ["tls"] }

# Cryptography
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
sha2 = "0.10"
rand = "0.8"
x509-cert = "0.2"

# Hashing
blake3 = "1"
imghash = "1"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
config = "0.14"
bytes = "1"
dashmap = "6"
prometheus = "0.13"
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# Image processing
image = "0.25"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
